name: Bibliada
options:
  bundleIdPrefix: com.bibliada
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # DEVELOPMENT_TEAM comes from BIBLIADA_TEAM_ID and is empty by default (no
    # Apple Developer Team available in CI / on a fresh clone). With a real
    # team, Automatic signing + ad-hoc-fallback identity "-" lets Xcode obtain
    # a real development certificate and provisioning profile, so entitlements
    # (including the group.com.bibliada.shared App Group) are actually granted.
    #
    # Without a team, Xcode/xcodebuild *refuses to build at all* once
    # entitlements like application-groups are present ("... has entitlements
    # that require signing with a development certificate"): ad-hoc signing
    # cannot satisfy them, unlike a plain sandbox entitlement. build.sh detects
    # an empty BIBLIADA_TEAM_ID and passes CODE_SIGNING_ALLOWED=NO
    # CODE_SIGNING_REQUIRED=NO on the xcodebuild command line for that case,
    # producing an unsigned local build that runs fine but cannot see the App
    # Group — SettingsStore then falls back to UserDefaults.standard and the
    # widget shows defaults instead of the app's chosen settings. See README.md.
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ${BIBLIADA_TEAM_ID}

targets:
  Bibliada:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: App
        excludes:
          - "Info.plist"
          - "Bibliada.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bibliada.Bibliada
        PRODUCT_NAME: Bibliada
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Bibliada.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - target: BibliadaWidget
        embed: true
        codeSign: true

  BibliadaWidget:
    type: app-extension
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Widget
        excludes:
          - "Info.plist"
          - "BibliadaWidget.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bibliada.Bibliada.Widget
        PRODUCT_NAME: BibliadaWidget
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/BibliadaWidget.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES

schemes:
  Bibliada:
    build:
      targets:
        Bibliada: all
    run:
      config: Debug
    archive:
      config: Release
