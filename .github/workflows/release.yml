# Bibliada release workflow.
#
# Runs the same pipeline as scripts/release.sh on a hosted macOS runner:
#   xcodegen -> archive -> export (Developer ID) -> verify -> notarize
#   -> staple -> .dmg -> notarize/staple the .dmg -> checksums -> GitHub Release
#
# Trigger:
#   * push a tag matching v*  (e.g. `git tag -a v1.1 -m 'Bibliada 1.1' && git push --tags`)
#   * or run it manually from the Actions tab (workflow_dispatch) to do a
#     dry run with notarization skipped.
#
# ---------------------------------------------------------------------------
# REQUIRED REPOSITORY SECRETS  (Settings > Secrets and variables > Actions)
# ---------------------------------------------------------------------------
#
#   BIBLIADA_TEAM_ID
#       Your 10-character Apple Developer Team ID (e.g. ABCDE12345). Same value
#       the local build.sh / project.yml already read from the environment.
#       Not really secret, but keeping it here avoids hard-coding it in the repo.
#
#   DEVELOPER_ID_CERT_P12_BASE64
#       Your "Developer ID Application" certificate AND its private key,
#       exported from Keychain Access as a .p12, then base64-encoded:
#           base64 -i DeveloperID.p12 | pbcopy
#       Export from Keychain Access > My Certificates > right-click the
#       "Developer ID Application: ..." entry > Export. You must export the
#       certificate row (which carries the key), not the bare key.
#
#   DEVELOPER_ID_CERT_PASSWORD
#       The password you set when exporting that .p12. Must not be empty —
#       `security import` treats an empty passphrase inconsistently.
#
#   KEYCHAIN_PASSWORD
#       Any random string. Used only to create/unlock the throwaway keychain on
#       the runner; it never leaves the job. Generate one with `openssl rand -hex 32`.
#
#   ASC_KEY_P8_BASE64
#       App Store Connect API private key (AuthKey_XXXXXXXXXX.p8), base64-encoded:
#           base64 -i AuthKey_XXXXXXXXXX.p8 | pbcopy
#       Create it at App Store Connect > Users and Access > Integrations > Keys,
#       with the "Developer" role (sufficient for notarization). Apple lets you
#       download the .p8 exactly once — save it before leaving the page.
#       API key auth is used instead of an Apple ID + app-specific password
#       because it needs no 2FA, is revocable independently of your account, and
#       is what notarytool documents for automation.
#
#   ASC_KEY_ID
#       The 10-character Key ID shown next to the key in App Store Connect.
#
#   ASC_ISSUER_ID
#       The UUID shown above the key list ("Issuer ID"). REQUIRED for Team keys;
#       omit the secret entirely if you created an Individual key (notarytool
#       rejects an issuer for Individual keys).
#
# OPTIONAL, only for the Mac App Store job (release-app-store, disabled by
# default because the project is not yet App Store compliant):
#
#   APPLE_DISTRIBUTION_CERT_P12_BASE64   "Apple Distribution" cert + key, base64 .p12
#   APPLE_DISTRIBUTION_CERT_PASSWORD     its export password
#   MAC_INSTALLER_CERT_P12_BASE64        "3rd Party Mac Developer Installer" cert + key
#   MAC_INSTALLER_CERT_PASSWORD          its export password
#
# ---------------------------------------------------------------------------

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version (default: MARKETING_VERSION from project.yml)'
        required: false
        type: string
      skip_notarize:
        description: 'Skip notarization (dry run — produces an UNDISTRIBUTABLE build)'
        required: false
        default: false
        type: boolean

# Only one release may be in flight at a time: two concurrent notarizations of
# the same version would race on the artifact directory and confuse the notary
# history.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # needed to create the GitHub Release and upload assets

jobs:
  developer-id:
    name: Developer ID (notarized .dmg)
    runs-on: macos-15
    # Generous: two notary round trips (app, then dmg) at up to 45 minutes each
    # in the worst case, plus the build.
    timeout-minutes: 120

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # release.sh records the commit in RELEASE.txt and checks tags for the
          # "already released" preflight, so it needs real history, not a
          # 1-commit shallow clone.
          fetch-depth: 0

      - name: Select Xcode
        # The runner image ships several Xcodes; pin one so a runner image
        # update cannot silently change the SDK a release was built against.
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode_26.app
          xcodebuild -version
          xcrun notarytool --version

      - name: Install XcodeGen
        # Bibliada.xcodeproj is gitignored and generated; without XcodeGen there
        # is nothing to build. release.sh regenerates it on every run so CI can
        # never build from a stale project file.
        run: brew install xcodegen

      - name: Import signing certificate into a temporary keychain
        env:
          CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          : "${CERT_P12_BASE64:?DEVELOPER_ID_CERT_P12_BASE64 secret is not set}"
          : "${CERT_PASSWORD:?DEVELOPER_ID_CERT_PASSWORD secret is not set}"
          : "${KEYCHAIN_PASSWORD:?KEYCHAIN_PASSWORD secret is not set}"

          KEYCHAIN_PATH="$RUNNER_TEMP/bibliada-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"

          # Decode outside the repo so a stray `git add -A` can never commit it.
          echo -n "$CERT_P12_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # No auto-lock: a keychain that relocks mid-build makes codesign fail
          # with an opaque "User interaction is not allowed" error.
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # -A would allow any app to use the key; instead allow exactly the
          # tools that need it.
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/productbuild

          # Without this, codesign triggers a GUI keychain prompt that no one can
          # answer on a headless runner, and the job hangs until the timeout.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null

          # Put it first in the search list so xcodebuild/codesign find it.
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"

          rm -f "$CERT_PATH"

          echo "Imported identities:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          echo "BIBLIADA_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          : "${ASC_KEY_P8_BASE64:?ASC_KEY_P8_BASE64 secret is not set}"

          KEY_PATH="$RUNNER_TEMP/asc-api-key.p8"
          echo -n "$ASC_KEY_P8_BASE64" | base64 --decode -o "$KEY_PATH"
          chmod 600 "$KEY_PATH"

          # release.sh picks these up and passes --key/--key-id/--issuer to
          # notarytool and -authenticationKey* to xcodebuild, so no keychain
          # profile (and no `notarytool store-credentials`) is needed in CI.
          echo "BIBLIADA_ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build, notarize and package
        env:
          BIBLIADA_TEAM_ID: ${{ secrets.BIBLIADA_TEAM_ID }}
          BIBLIADA_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          BIBLIADA_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          # The tag is the source of truth for the version on a tag push.
          BIBLIADA_VERSION: ${{ inputs.version }}
          # CI always builds from a fresh checkout at a tag; the "already
          # released" guard would otherwise reject the very tag that triggered
          # the run.
          BIBLIADA_ALLOW_RELEASED: '1'
          BIBLIADA_NOTARY_TIMEOUT: 45m
        run: |
          set -euo pipefail

          : "${BIBLIADA_TEAM_ID:?BIBLIADA_TEAM_ID secret is not set}"

          # Derive the version from the tag (refs/tags/v1.1 -> 1.1) unless the
          # manual input supplied one.
          if [ -z "${BIBLIADA_VERSION:-}" ] && [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            BIBLIADA_VERSION="${GITHUB_REF_NAME#v}"
            export BIBLIADA_VERSION
          fi

          # Monotonic build number that is unique per run and sorts correctly.
          export BIBLIADA_BUILD="$GITHUB_RUN_NUMBER"

          # Note: the runner's /bin/bash is 3.2, where `"${ARGS[@]}"` on an empty
          # array is an unbound-variable error under `set -u`. Hence the
          # `${ARGS[@]+...}` guard rather than a plain expansion.
          ARGS=()
          if [ "${{ inputs.skip_notarize }}" = "true" ]; then
            ARGS+=(--skip-notarize)
          fi

          ./scripts/release.sh --variant developer-id ${ARGS[@]+"${ARGS[@]}"}

      - name: Locate artifacts
        id: artifacts
        run: |
          set -euo pipefail
          DIR="$(find dist -mindepth 1 -maxdepth 1 -type d | head -n1)"
          [ -n "$DIR" ] || { echo "no artifact directory under dist/" >&2; exit 1; }
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          ls -lh "$DIR"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        # Upload even on failure: the notarytool log that release.sh saves into
        # the release directory is the thing you need to debug a rejection.
        if: always()
        with:
          name: bibliada-developer-id
          path: dist/**
          if-no-files-found: warn
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref_type == 'tag' && success()
        env:
          GH_TOKEN: ${{ github.token }}
          DIR: ${{ steps.artifacts.outputs.dir }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --title "Bibliada $GITHUB_REF_NAME" \
            --notes-file "$DIR/RELEASE.txt" \
            --verify-tag \
            "$DIR"/*.dmg "$DIR"/*.zip "$DIR/SHA256SUMS"

      - name: Clean up keychain and API key
        if: always()
        run: |
          set -euo pipefail
          # $RUNNER_TEMP is wiped between jobs on hosted runners, but be explicit
          # so this workflow is also safe on a self-hosted runner.
          security delete-keychain "$RUNNER_TEMP/bibliada-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/asc-api-key.p8" "$RUNNER_TEMP/developer-id.p12"

  # ---------------------------------------------------------------------------
  # Mac App Store build.
  #
  # Disabled by default: the project is not yet App Store compliant. The app
  # target sets ENABLE_APP_SANDBOX: NO (the store requires the sandbox),
  # App/Info.plist has no LSApplicationCategoryType (upload error ITMS-90242),
  # and AppIcon.appiconset contains no PNGs (upload error ITMS-90236). Enable by
  # changing the `if:` below to `true` once those are fixed and the sandboxed
  # entitlements variants exist.
  # ---------------------------------------------------------------------------
  app-store:
    name: Mac App Store (.pkg)
    runs-on: macos-15
    timeout-minutes: 60
    if: false

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_26.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import App Store signing certificates
        env:
          DIST_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12_BASE64 }}
          DIST_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
          INSTALLER_P12_BASE64: ${{ secrets.MAC_INSTALLER_CERT_P12_BASE64 }}
          INSTALLER_PASSWORD: ${{ secrets.MAC_INSTALLER_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/bibliada-appstore.keychain-db"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Two separate certificates: "Apple Distribution" signs the .app,
          # "3rd Party Mac Developer Installer" signs the .pkg. Missing the
          # second is the usual cause of "productbuild: error: Could not find
          # appropriate signing identity".
          for pair in "DIST:$DIST_P12_BASE64:$DIST_PASSWORD" \
                      "INSTALLER:$INSTALLER_P12_BASE64:$INSTALLER_PASSWORD"; do
            name="${pair%%:*}"
            rest="${pair#*:}"
            b64="${rest%%:*}"
            pw="${rest#*:}"
            p12="$RUNNER_TEMP/$name.p12"
            echo -n "$b64" | base64 --decode -o "$p12"
            security import "$p12" -k "$KEYCHAIN_PATH" -P "$pw" \
              -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
            rm -f "$p12"
          done

          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"

          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          echo "BIBLIADA_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/asc-api-key.p8"
          echo -n "$ASC_KEY_P8_BASE64" | base64 --decode -o "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "BIBLIADA_ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build and upload to App Store Connect
        env:
          BIBLIADA_TEAM_ID: ${{ secrets.BIBLIADA_TEAM_ID }}
          BIBLIADA_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          BIBLIADA_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BIBLIADA_ALLOW_RELEASED: '1'
          # App Store builds need a sandboxed variant of the entitlements
          # (same App Group as the Developer ID variant — see PIPELINE.md).
          # Create these files before enabling this job.
          BIBLIADA_APP_ENTITLEMENTS: App/Bibliada-AppStore.entitlements
          BIBLIADA_WIDGET_ENTITLEMENTS: Widget/BibliadaWidget-AppStore.entitlements
        run: |
          set -euo pipefail
          export BIBLIADA_VERSION="${GITHUB_REF_NAME#v}"
          export BIBLIADA_BUILD="$GITHUB_RUN_NUMBER"
          ./scripts/release.sh --variant app-store --upload

      - name: Clean up
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/bibliada-appstore.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/asc-api-key.p8"
